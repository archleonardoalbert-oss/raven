# Temporal: comprueba la forma del secreto sin mostrarlo (longitud, caracteres no ASCII, prefijo).
name: Diagnóstico del token
on: workflow_dispatch
jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "longitud: ${#T}"
          echo "prefijo: $(printf '%s' "$T" | head -c 5)"
          echo "caracteres fuera de ASCII imprimible: $(printf '%s' "$T" | LC_ALL=C tr -d ' -~' | wc -c)"
          echo "espacios o saltos: $(printf '%s' "$T" | tr -cd ' \t\r\n' | wc -c)"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -oE '"success":[a-z]+|"message":"[^"]+"'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
