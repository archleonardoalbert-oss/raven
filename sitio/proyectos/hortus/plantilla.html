<!doctype html>
<html lang="es" data-idioma="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{es meta.titulo}}</title>
<meta name="titulo-es" content="{{es meta.titulo}}">
<meta name="titulo-en" content="{{en meta.titulo}}">
<meta name="description" content="{{es meta.descripcion}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060e'/%3E%3Cpath d='M16 28V16M16 18l-6-6M16 16l6-7M10 12l-3 1M22 9l3 0' stroke='%23e8d9a8' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='16' cy='6' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/proyecto.css">
<link rel="stylesheet" href="estilo.css">
<script src="../../assets/idioma.js"></script>
</head>
<body>
<canvas id="cielo" aria-hidden="true"></canvas>

<header class="p-barra">
  <a class="p-volver" href="../">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 1 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/></svg>
    {{t pagina.1}}
  </a>
  <div class="p-idiomas" role="group" aria-label="Idioma / Language">
    <button type="button" data-poner-idioma="es">ES</button>
    <button type="button" data-poner-idioma="en">EN</button>
  </div>
</header>

<main>
  <section class="p-portada">
    <h1 class="titulo">Hortus<br>Algorithmicus</h1>
    <p class="p-lema">
      {{t pagina.2}}
    </p>
    <div class="p-acciones">
      <!--DEMO--><a class="p-boton boton-oro" href="../../hortus/">
        {{t pagina.3}}
      </a><!--/DEMO-->
      <!--CODIGO-->
    </div>
  </section>

  <div class="p-cuerpo">
    <figure class="p-video lamina">
      <!--MEDIO-->
      <figcaption>
        {{t pagina.4}}
      </figcaption>
    </figure>

    <article class="p-texto">
      <section>
        <p class="fig">Fig. I</p>
        <h2>{{t pagina.5}}</h2>
        <div lang="es">{{es-html pagina.6}}</div><div lang="en">{{en-html pagina.6}}</div>
      </section>

      <section>
        <p class="fig">Fig. II</p>
        <h2>{{t pagina.7}}</h2>
        <div lang="es">{{es-html pagina.8}}</div><div lang="en">{{en-html pagina.8}}</div>
      </section>

      <section>
        <p class="fig">Fig. III</p>
        <h2>{{t pagina.9}}</h2>
        <div lang="es">{{es-html pagina.10}}</div><div lang="en">{{en-html pagina.10}}</div>
      </section>
      <!--NOVEDADES-->
    </article>
  </div>
  <canvas id="vida" aria-hidden="true"></canvas>
</main>

<script src="hortus.js"></script>
</body>
</html>
