<!doctype html>
<html lang="es" data-idioma="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{es meta.titulo}}</title>
<meta name="titulo-es" content="{{es meta.titulo}}">
<meta name="titulo-en" content="{{en meta.titulo}}">
<meta name="description" content="{{es meta.descripcion}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/fuentes/fuentes.css">
<link rel="stylesheet" href="../../assets/proyecto.css">
<link rel="stylesheet" href="estilo.css">
<script src="../../assets/idioma.js"></script>
</head>
<body>
<header class="p-barra">
  <a class="p-volver" href="../">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 1 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/></svg>
    {{t pagina.1}}
  </a>
  <div class="p-idiomas" role="group" aria-label="Idioma / Language">
    <button type="button" data-poner-idioma="es">ES</button>
    <button type="button" data-poner-idioma="en">EN</button>
  </div>
</header>

<main>
  <section class="p-portada">
    <canvas id="curvas" aria-hidden="true"></canvas>
    <div class="luna" aria-hidden="true"></div>
    <svg class="cordillera" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true"></svg>
    <h1 class="titulo-difuso" aria-label="Penumbra"><span>P</span><span>e</span><span>n</span><span>u</span><span>m</span><span>b</span><span>r</span><span>a</span></h1>
    <p class="p-lema">
      {{t pagina.2}}
    </p>
    <div class="p-acciones">
      <!--DEMO--><a class="p-boton boton-oro" href="../../penumbra/">
        {{t pagina.3}}
      </a><!--/DEMO-->
      <!--CODIGO-->
    </div>
  </section>

  <div class="p-cuerpo">
    <figure class="p-video">
      <!--MEDIO-->
      <figcaption>
        {{t pagina.4}}
      </figcaption>
    </figure>

    <article class="p-texto">
      <!--CIFRAS-->
      <section data-grado>
        <h2>{{t pagina.5}}</h2>
        <div class="medidor" aria-hidden="true"><span class="medidor-barra"></span><span class="medidor-valor">0,00</span></div>
        <div lang="es">{{es-html pagina.6}}</div><div lang="en">{{en-html pagina.6}}</div>
      </section>

      <section data-grado>
        <h2>{{t pagina.7}}</h2>
        <div class="medidor" aria-hidden="true"><span class="medidor-barra"></span><span class="medidor-valor">0,00</span></div>
        <div lang="es">{{es-html pagina.8}}</div><div lang="en">{{en-html pagina.8}}</div>
      </section>

      <section data-grado>
        <h2>{{t pagina.9}}</h2>
        <div class="medidor" aria-hidden="true"><span class="medidor-barra"></span><span class="medidor-valor">0,00</span></div>
        <div lang="es">{{es-html pagina.10}}</div><div lang="en">{{en-html pagina.10}}</div>
      </section>
      <!--NOVEDADES-->
    </article>
  </div>
</main>

<script src="penumbra.js"></script>
</body>
</html>
