<!doctype html>
<html lang="es" data-idioma="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos · Raven</title>
<meta name="titulo-es" content="Proyectos · Raven">
<meta name="titulo-en" content="Projects · Raven">
<meta name="description" content="Todos los proyectos de Leonardo Albert López.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="biblioteca.css">
<link rel="stylesheet" href="../assets/mini-obra.css">
<script src="../assets/idioma.js"></script>
</head>
<body>
<canvas id="cielo" aria-hidden="true"></canvas>

<header class="barra">
  <a class="marca" href="../">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L55.5 44.5 L96 50 L55.5 55.5 L50 96 L44.5 55.5 L4 50 L44.5 44.5 Z"/><circle cx="50" cy="50" r="7"/></svg>
    <span>Raven</span>
  </a>
  <div class="idiomas" role="group" aria-label="Idioma / Language">
    <button type="button" data-poner-idioma="es">ES</button>
    <button type="button" data-poner-idioma="en">EN</button>
  </div>
</header>

<main>
  <section class="cabeza">
    <h1><span lang="es">Proyectos</span><span lang="en">Projects</span></h1>
    <div class="controles">
      <label class="buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input type="search" id="q" autocomplete="off" placeholder="Buscar" aria-label="Buscar proyectos">
      </label>
      <label class="orden">
        <span class="visualmente-oculto"><span lang="es">Ordenar</span><span lang="en">Sort</span></span>
        <select id="orden">
          <option value="destacados" data-es="Destacados primero" data-en="Featured first"></option>
          <option value="recientes" data-es="Más recientes" data-en="Most recent"></option>
          <option value="nombre" data-es="Por nombre" data-en="By name"></option>
        </select>
      </label>
    </div>
    <div class="etiquetas" id="etiquetas" role="group" aria-label="Etiquetas"></div>
    <p class="cuenta" id="cuenta" aria-live="polite"></p>
  </section>

  <ul class="rejilla" id="rejilla"></ul>
  <div class="vacio" id="vacio" hidden>
    <p><span lang="es">Ningún proyecto coincide con esa búsqueda.</span><span lang="en">No project matches that search.</span></p>
    <button type="button" class="boton fantasma" id="limpiar"><span lang="es">Quitar filtros</span><span lang="en">Clear filters</span></button>
  </div>
</main>

<script type="module" src="biblioteca.js"></script>
</body>
</html>
